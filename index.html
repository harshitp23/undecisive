<!DOCTYPE html>
<html lang="en" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick One</title>
<meta name="description" content="A personal hub for things to buy, eat, cook and watch — with a wheel for when you can't decide.">
<meta name="theme-color" content="#16151C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pick One">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%2316151C'/><path d='M50 8a42 42 0 0 1 42 42H50z' fill='%23FFB03A'/><path d='M92 50a42 42 0 0 1-42 42V50z' fill='%23FF5C7A'/><path d='M50 92A42 42 0 0 1 8 50h42z' fill='%234ECDC4'/><path d='M8 50A42 42 0 0 1 50 8v42z' fill='%23A78BFA'/><circle cx='50' cy='50' r='9' fill='%23F3F0FF'/></svg>">
<style>
/* ============================================================
   PICK ONE — design tokens
   Palette: ink base + four section identities (place = colour)
   Type:    Bricolage Grotesque (display) / Instrument Sans (UI)
            JetBrains Mono (counts, codes, meta)
   ============================================================ */
:root{
  --acc-h:38; --acc:#FFB03A;
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --sp:clamp(14px,3.4vw,22px);
  --ease:cubic-bezier(.2,.8,.2,1);
  --rail:82px;
  --font-d:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --font-b:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,monospace;
}
html[data-theme="ink"]{
  --bg:#16151C; --bg-2:#100F15; --surf:#211F2A; --surf-2:#2A2735;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --tx:#F1EEF9; --tx-2:#A7A2B8; --tx-3:#6F6B80;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 30px -18px #000;
  --acc-soft:color-mix(in oklab, var(--acc) 16%, transparent);
  --acc-line:color-mix(in oklab, var(--acc) 40%, transparent);
  --on-acc:#16151C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:var(--font-b); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  transition:background .3s var(--ease), color .3s var(--ease);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
::selection{background:var(--acc);color:var(--on-acc)}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100dvh}
.main{flex:1;min-width:0;padding:0 var(--sp) calc(96px + env(safe-area-inset-bottom));}
.wrap{max-width:940px;margin:0 auto}

/* ---------- side rail (desktop) ---------- */
.rail{
  display:none; width:var(--rail); flex-direction:column; align-items:center; gap:6px;
  padding:calc(18px + env(safe-area-inset-top)) 0 18px; border-right:1px solid var(--line); background:var(--bg-2);
  position:sticky; top:0; height:100dvh;
}
.mark{width:34px;height:34px;margin-bottom:14px;flex:none}
.rail-btn{
  width:60px;padding:10px 0;border-radius:var(--r-md);display:grid;justify-items:center;gap:5px;
  color:var(--tx-3);transition:.18s var(--ease);position:relative;
}
.rail-btn svg{width:23px;height:23px;stroke-width:1.7}
.rail-btn b{font:600 10.5px/1 var(--font-b);letter-spacing:.04em;text-transform:uppercase}
.rail-btn:hover{color:var(--tx-2);background:var(--surf)}
.rail-btn[aria-current="true"]{color:var(--sec);background:color-mix(in oklab,var(--sec) 14%,transparent)}
.rail-btn[aria-current="true"]::before{
  content:"";position:absolute;left:-11px;top:50%;translate:0 -50%;
  width:3px;height:26px;border-radius:0 3px 3px 0;background:var(--sec)
}
.rail-foot{margin-top:auto;display:grid;gap:4px}
.icon-btn{
  width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--tx-3);
  transition:.18s var(--ease)
}
.icon-btn:hover{color:var(--tx);background:var(--surf)}
.icon-btn svg{width:19px;height:19px;stroke-width:1.8}

/* ---------- header ---------- */
.top{padding:calc(26px + env(safe-area-inset-top)) 0 14px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.eyebrow{
  font:700 10.5px/1 var(--font-m);letter-spacing:.18em;text-transform:uppercase;
  color:var(--acc);display:flex;align-items:center;gap:8px;margin:0 0 8px
}
.eyebrow::after{content:"";height:1px;flex:1;background:var(--acc-line);min-width:26px}
h1{
  font-family:var(--font-d);font-weight:800;font-size:clamp(30px,7.2vw,46px);
  line-height:.95;letter-spacing:-.03em;margin:0
}
h1 span{color:var(--acc)}
.sub{color:var(--tx-2);font-size:14.5px;margin:8px 0 0;max-width:46ch}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- the spin button (signature) ---------- */
.spin-cta{
  display:inline-flex;align-items:center;gap:10px;padding:13px 20px 13px 15px;border-radius:999px;
  background:var(--acc);color:var(--on-acc);font-weight:600;font-size:15px;
  box-shadow:0 8px 22px -12px var(--acc);transition:.2s var(--ease)
}
.spin-cta:hover{transform:translateY(-2px);box-shadow:0 14px 26px -12px var(--acc)}
.spin-cta:active{transform:translateY(0) scale(.98)}
.spin-cta .disc{width:22px;height:22px;flex:none}
.spin-cta:hover .disc{animation:rot 1.1s var(--ease)}
@keyframes rot{to{rotate:360deg}}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:8px;align-items:center;margin:18px 0 10px;flex-wrap:wrap}
.search{
  flex:1;min-width:180px;display:flex;align-items:center;gap:9px;padding:0 14px;height:46px;
  background:var(--surf);border:1px solid var(--line);border-radius:999px
}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px}
.search input::placeholder{color:var(--tx-3)}
.search svg{width:17px;height:17px;color:var(--tx-3);flex:none}
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{
  padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--tx-2);
  transition:.15s var(--ease);white-space:nowrap
}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}

/* ---------- group cards ---------- */
.group{
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r-lg);
  margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)
}
.group-head{list-style:none;cursor:pointer;
  display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px;text-align:left;
  transition:background .15s var(--ease)
}
.group-head:hover{background:var(--surf-2)}
.group-head::-webkit-details-marker{display:none}
.chev{width:18px;height:18px;color:var(--tx-3);flex:none;transition:rotate .22s var(--ease)}
.group[open] .chev{rotate:90deg}
.g-title{font-family:var(--font-d);font-weight:700;font-size:17px;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{
  font:700 11px/1 var(--font-m);padding:5px 8px;border-radius:7px;background:var(--acc-soft);
  color:var(--acc);letter-spacing:.03em;flex:none
}
.pill.ghost{background:var(--bg-2);color:var(--tx-3)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
.group-body{padding:0 12px 12px}

/* country header */
.country{margin:26px 0 12px;display:flex;align-items:center;gap:12px}
.country h2{
  font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.02em;margin:0;
  text-transform:uppercase
}
.flagcode{
  font:700 11px/1 var(--font-m);letter-spacing:.1em;padding:6px 9px;border-radius:8px;
  border:1px solid var(--acc-line);color:var(--acc)
}
.country .rule{flex:1;height:1px;background:var(--line)}
.country-del{opacity:0;transition:opacity .15s var(--ease);color:var(--tx-3)}
.country:hover .country-del,.country:focus-within .country-del{opacity:.6}
.country-del:hover{opacity:1;color:#FF6B6B;background:var(--bg-2)}

/* ---------- rows ---------- */
.row{
  display:flex;align-items:center;gap:11px;padding:11px 8px;border-radius:var(--r-sm);
  transition:background .15s var(--ease)
}
.row+.row{box-shadow:0 -1px 0 var(--line)}
.row:hover{background:var(--surf-2)}
.check{
  width:23px;height:23px;border-radius:8px;border:2px solid var(--line-2);flex:none;
  display:grid;place-items:center;transition:.16s var(--ease)
}
.check svg{width:13px;height:13px;stroke-width:3.4;opacity:0;scale:.6;transition:.16s var(--ease);color:var(--on-acc)}
.row[data-done="1"] .check{background:var(--acc);border-color:var(--acc)}
.row[data-done="1"] .check svg{opacity:1;scale:1}
.row[data-done="1"] .r-name{color:var(--tx-3);text-decoration:line-through}
.r-main{flex:1;min-width:0}
.r-name{font-size:15px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-note{font-size:12.5px;color:var(--tx-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-acts{display:flex;gap:2px;flex:none;opacity:.55;transition:opacity .15s}
.row:hover .r-acts,.row:focus-within .r-acts{opacity:1}
.mini{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--tx-2)}
.mini:hover{background:var(--bg-2);color:var(--tx)}
.mini svg{width:16px;height:16px;stroke-width:1.9}
.mini.link:hover{color:var(--acc)}
.mini.logbtn:hover{color:#4ADE80}

/* ---------- quick add ---------- */
.qadd{padding:8px 8px 4px}
.qadd-row{display:flex;gap:8px;align-items:center}
.qadd[data-collapsed="1"] .qadd-row{display:none}
.qadd[data-collapsed="0"] .qadd-open{display:none}
.qadd-open{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:12px;
  border:1px dashed var(--line-2);background:transparent;color:var(--tx-2);font-weight:600;font-size:14px;
  transition:.15s var(--ease)}
.qadd-open:hover{color:var(--acc);border-color:var(--acc-line);background:var(--bg-2)}
.qadd-open svg{width:16px;height:16px;stroke-width:2}
.qadd input{
  flex:1;height:42px;padding:0 14px;border-radius:12px;border:1px dashed var(--line-2);
  background:transparent;outline:none;font-size:14.5px
}
.qadd input:focus{border-style:solid;border-color:var(--acc);background:var(--bg-2)}
.qadd input::placeholder{color:var(--tx-3)}
.qadd button{
  height:42px;padding:0 15px;border-radius:12px;background:var(--acc-soft);color:var(--acc);
  font-weight:600;font-size:14px;flex:none
}
.qadd button:hover{background:var(--acc);color:var(--on-acc)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;
  background:var(--surf);border:1px solid var(--line);font-weight:600;font-size:14.5px;
  transition:.16s var(--ease)
}
.btn:hover{border-color:var(--line-2);background:var(--surf-2)}
.btn svg{width:17px;height:17px;stroke-width:2}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:#FF6B6B}
.btn.wide{width:100%;justify-content:center}
.btn.dash{border-style:dashed;color:var(--tx-2);width:100%;justify-content:center;background:transparent}
.btn.dash:hover{color:var(--acc);border-color:var(--acc-line)}

/* ---------- empty ---------- */
.empty{
  text-align:center;padding:44px 22px;border:1px dashed var(--line-2);border-radius:var(--r-lg);
  color:var(--tx-2)
}
.empty h3{font-family:var(--font-d);font-size:19px;margin:0 0 6px;color:var(--tx)}
.empty p{margin:0 0 18px;font-size:14px}

/* ---------- recipe cards ---------- */
.rgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.rcard{
  background:var(--surf);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;
  text-align:left;display:flex;flex-direction:column;gap:9px;min-height:124px;
  transition:.18s var(--ease);box-shadow:var(--shadow)
}
.rcard:hover{transform:translateY(-3px);border-color:var(--acc-line)}
.rcard .rtitle{display:block;font-family:var(--font-d);font-weight:700;font-size:17.5px;margin:0;letter-spacing:-.01em;line-height:1.15}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tag{font:600 11px/1 var(--font-m);padding:5px 8px;border-radius:6px;background:var(--bg-2);color:var(--tx-2)}
.rcard .meta{font:500 11.5px/1 var(--font-m);color:var(--tx-3);letter-spacing:.03em}

/* ---------- dialogs ---------- */
dialog{
  border:0;padding:0;background:transparent;max-height:100dvh;max-width:100vw;
  color:var(--tx)
}
dialog::backdrop{background:color-mix(in oklab,var(--bg-2) 78%,transparent);backdrop-filter:blur(7px)}
.sheet{
  position:relative;width:min(560px,calc(100vw - 22px));background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:22px;box-shadow:0 30px 70px -30px #000;
  max-height:calc(100dvh - 32px);overflow:auto;animation:pop .26s var(--ease)
}
.sheet.wide{width:min(760px,calc(100vw - 22px))}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.sheet h2{font-family:var(--font-d);font-weight:800;font-size:23px;margin:0 0 3px;letter-spacing:-.02em}
.sheet .hint{color:var(--tx-2);font-size:13.5px;margin:0 0 18px}
.field{margin-bottom:14px}
.field label{display:block;font:600 11.5px/1 var(--font-m);letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx-3);margin-bottom:7px}
.field input,.field textarea,.field select{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg-2);outline:none;font-size:15px;transition:.15s var(--ease)
}
.field textarea{min-height:120px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--acc);background:var(--surf-2)}
.f-row{display:flex;gap:10px}
.f-row .field{flex:1}
.sheet-foot{display:flex;gap:9px;margin-top:20px}
.sheet-foot .btn{flex:1;justify-content:center}
.x{position:absolute;top:14px;right:14px}

/* ---------- wheel ---------- */
.wheel-sheet{width:min(520px,calc(100vw - 22px));text-align:center}
.wheel-stage{position:relative;width:min(320px,74vw);aspect-ratio:1;margin:6px auto 4px}
.wheel-svg{width:100%;height:100%;transform:rotate(0deg);filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.wheel-svg text{font:700 11px var(--font-b);fill:#16151C;letter-spacing:.01em}
.needle{
  position:absolute;top:-7px;left:50%;translate:-50% 0;z-index:3;
  width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
  border-top:22px solid var(--tx);filter:drop-shadow(0 3px 5px rgba(0,0,0,.4));transform-origin:50% 12%
}
.needle.tick{animation:tick .09s ease}
@keyframes tick{50%{rotate:-13deg}}
.hub{
  position:absolute;inset:0;margin:auto;width:22%;height:22%;border-radius:50%;
  background:var(--surf);border:3px solid var(--bg-2);display:grid;place-items:center;z-index:2;
  box-shadow:0 6px 16px rgba(0,0,0,.35)
}
.hub b{font-family:var(--font-d);font-size:12px;letter-spacing:-.01em;color:var(--tx-2)}
.result{
  margin:14px 0 4px;padding:16px;border-radius:var(--r-md);border:1px solid var(--acc-line);
  background:var(--acc-soft);animation:pop .3s var(--ease)
}
.result .lbl{font:700 10.5px/1 var(--font-m);letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
.result .val{font-family:var(--font-d);font-weight:800;font-size:clamp(20px,5.4vw,27px);
  line-height:1.1;margin:8px 0 2px;letter-spacing:-.02em}
.result .where{font-size:13px;color:var(--tx-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 4px;
  max-height:132px;overflow:auto;padding:2px}
.chip{
  padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);
  font-size:13px;font-weight:500;color:var(--tx-3);transition:.14s var(--ease)
}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
.chips-head{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px;
  font:700 10.5px/1 var(--font-m);letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3)}
.chips-head button{font:inherit;color:var(--acc);letter-spacing:.14em}

/* ---------- recipe reader ---------- */
.reader h2{font-size:clamp(24px,6vw,32px);margin-bottom:8px}
.reader .sec-lbl{font:700 10.5px/1 var(--font-m);letter-spacing:.16em;text-transform:uppercase;
  color:var(--acc);margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.reader .sec-lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.ing{display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:10px;
  width:100%;text-align:left;font-size:15px;transition:.14s var(--ease)}
.ing:hover{background:var(--surf-2)}
.ing[aria-pressed="true"]{color:var(--tx-3)}
.ing[aria-pressed="true"] .txt{text-decoration:line-through}
.box{width:19px;height:19px;border-radius:6px;border:2px solid var(--line-2);flex:none;margin-top:2px}
.ing[aria-pressed="true"] .box{background:var(--acc);border-color:var(--acc)}
.step{display:flex;gap:13px;padding:11px 10px;border-radius:10px;width:100%;text-align:left;
  font-size:15px;line-height:1.6;transition:.14s var(--ease)}
.step:hover{background:var(--surf-2)}
.step .n{font:700 12px/1 var(--font-m);width:25px;height:25px;border-radius:8px;flex:none;
  display:grid;place-items:center;background:var(--bg-2);color:var(--tx-3);margin-top:1px}
.step[aria-pressed="true"]{opacity:.45}
.step[aria-pressed="true"] .n{background:var(--acc);color:var(--on-acc)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));translate:-50% 0;z-index:99;
  display:flex;align-items:center;gap:14px;padding:12px 12px 12px 18px;border-radius:999px;
  background:var(--surf-2);border:1px solid var(--line-2);box-shadow:0 18px 40px -20px #000;
  font-size:14px;animation:pop .25s var(--ease);max-width:calc(100vw - 32px)
}
.toast button{color:var(--acc);font-weight:700;font-size:13.5px;padding:6px 12px;border-radius:999px}
.toast button:hover{background:var(--acc-soft)}

/* ---------- bottom tabs (mobile) ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--line)
}
.tab{flex:1;min-width:0;display:grid;justify-items:center;gap:4px;padding:8px 1px;border-radius:14px;color:var(--tx-3)}
.tab svg{width:21px;height:21px;stroke-width:1.8}
.tab b{font:600 9.5px/1 var(--font-b);letter-spacing:.01em}
@media (max-width:360px){ .tab b{font-size:9px} .tab svg{width:20px;height:20px} }
.tab[aria-current="true"]{color:var(--sec)}
.tab[aria-current="true"] svg{transform:translateY(-1px)}

@media (max-width:620px){
  .top{padding-top:calc(20px + env(safe-area-inset-top))}
  .top-actions{width:100%;margin-left:0}
  .spin-cta{width:100%;justify-content:center;padding:15px 20px}
  .toolbar{gap:7px}
  .seg{width:100%;overflow-x:auto}
}
@media (min-width:860px){
  .rail{display:flex}

}

  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}

.icon-btn,.tab{position:relative}
.sdot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;

body[data-sync="off"] .sdot{display:none}

.sync-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;

.sec-lbl .mult-seg{display:inline-flex;gap:2px;margin-left:auto;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.sec-lbl{align-items:center}
.mult-seg button{font:700 12px/1 var(--font-m);padding:6px 9px;border-radius:999px;color:var(--tx-3);transition:.14s var(--ease)}
.mult-seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
.cookmode-link{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--font-b);

.cookmode-link svg{width:14px;height:14px;stroke-width:2}

/* cooking mode */
#cookDlg{max-width:100vw;max-height:100dvh}
#cookDlg::backdrop{background:var(--bg)}
.cook-sheet{width:100vw;height:100dvh;background:var(--bg);display:flex;flex-direction:column;
  padding:0;animation:none;border:0;border-radius:0;overflow:hidden}
.cook-top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  border-bottom:1px solid var(--line);background:var(--bg-2)}
.cook-title{font-family:var(--font-d);font-weight:800;font-size:20px;letter-spacing:-.01em;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cook-top .mini{width:40px;height:40px}.cook-top .mini svg{width:20px;height:20px}

.cook-ings{list-style:none;padding:0;margin:0 0 30px}
.cook-ings li{font-size:20px;line-height:1.5;padding:9px 0;border-bottom:1px solid var(--line)}
.cook-steps{list-style:none;counter-reset:cs;padding:0;margin:0}
.cook-steps li{counter-increment:cs;margin-bottom:12px}
.cook-steps .cs{display:flex;gap:16px;width:100%;text-align:left;padding:16px 16px;border-radius:16px;
  background:var(--surf);border:1px solid var(--line);transition:.15s var(--ease)}
.cook-steps .cs::before{content:counter(cs);font:800 20px/1 var(--font-d);color:var(--acc);flex:none;
  width:34px;height:34px;display:grid;place-items:center;background:var(--acc-soft);border-radius:11px}

  text-align:center;background:var(--bg-2)}

@media (max-width:520px){
  .cook-ings li{font-size:18px}.cook-steps .cs .txt{font-size:18px}
}
.logday{display:flex;align-items:center;gap:12px;margin:22px 0 6px}

.logrow+.logrow{box-shadow:0 -1px 0 var(--line)}
.logrow:hover{background:var(--surf-2)}
.logic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:color-mix(in oklab,var(--sec) 16%,transparent);color:var(--sec)}

<script>
/* =========================================================================
   PICK ONE — a personal hub for buying, eating, cooking, watching.
   No build step, no dependencies. Everything lives in localStorage.
   ========================================================================= */

/* ---------- tiny helpers ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,9);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s=>String(s??'').toLowerCase().trim();
const safeUrl = u => { u=String(u||'').trim(); if(!u) return ''; return /^https?:\/\//i.test(u) ? u : 'https://'+u; };

/* ---------- ingredient scaling ---------- */
const VULGAR={"\u00bd":.5,"\u2153":1/3,"\u2154":2/3,"\u00bc":.25,"\u00be":.75,"\u2155":.2,"\u2156":.4,"\u2157":.6,"\u2158":.8,"\u2159":1/6,"\u215a":5/6,"\u215b":.125,"\u215c":.375,"\u215d":.625,"\u215e":.875};
const VCHARS="\u00bd\u2153\u2154\u00bc\u00be\u2155\u2156\u2157\u2158\u2159\u215a\u215b\u215c\u215d\u215e";
function niceNum(n){
  const r=Math.round(n*1000)/1000;
  if(Math.abs(r-Math.round(r))<1e-9) return String(Math.round(r));
  const whole=Math.floor(r+1e-9), frac=r-whole;
  const map=[[.5,"\u00bd"],[1/3,"\u2153"],[2/3,"\u2154"],[.25,"\u00bc"],[.75,"\u00be"],[.2,"\u2155"],[.125,"\u215b"],[.375,"\u215c"],[.625,"\u215d"],[.875,"\u215e"],[1/6,"\u2159"]];
  for(const [v,g] of map) if(Math.abs(frac-v)<0.02) return (whole?whole+" ":"")+g;
  return String(Math.round(r*100)/100);
}
const SCALE_RE=new RegExp("(\\d+)\\s+(\\d+)\\/(\\d+)|(\\d+)\\s*(["+VCHARS+"])|(["+VCHARS+"])|(\\d+)\\/(\\d+)|(\\d+(?:\\.\\d+)?)","g");
function scaleLine(line,mult){
  if(mult===1) return line;
  return line.replace(SCALE_RE,(m,w1,n,d,w2,vg,vonly,fn,fd,dec)=>{
    let val;
    if(w1!==undefined) val=+w1+(+n)/(+d);
    else if(w2!==undefined) val=+w2+VULGAR[vg];
    else if(vonly!==undefined) val=VULGAR[vonly];
    else if(fn!==undefined) val=(+fn)/(+fd);
    else val=parseFloat(dec);
    return niceNum(val*mult);
  });
}

/* ---------- icons ---------- */
const I = {
  bag:'<path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  fork:'<path d="M7 3v7a2 2 0 0 0 4 0V3"/><path d="M9 10v11"/><path d="M17 3c-1.5 1.5-2 3-2 5s.5 3 2 3 2-1 2-3-.5-3.5-2-5Z"/><path d="M17 11v10"/>',
  pot:'<path d="M4 9h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V9Z"/><path d="M2 9h2M20 9h2"/><path d="M8 6c0-1 1-1 1-2M12 6c0-1 1-1 1-2M16 6c0-1 1-1 1-2"/>',
  play:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="m10 9 5 3-5 3V9Z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',
  check:'<path d="m4 12 5 5L20 6"/>',
  link:'<path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/>',
  pen:'<path d="M4 20h4L20 8l-4-4L4 16v4Z"/>',
  trash:'<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  cog:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  star:'<path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.8 6.7 19.7l1.1-6.1L3.4 9.4l6-.8L12 3Z"/>',
  cart:'<circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.6 12h11L21 7H6"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  history:'<path d="M3.5 9a9 9 0 1 1-1 5"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/>',
  logadd:'<path d="M20 6 9 17l-5-5"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',
  chef:'<path d="M7 21h10M6 18h12v-3H6v3Z"/><path d="M8 15V9a4 4 0 0 1 .6-2.1A3 3 0 0 1 14 6a3 3 0 0 1 2 5.2V15"/>',
  expand:'<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>',
  back:'<path d="M19 12H5M12 19l-7-7 7-7"/>'
};
const ic = (n,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- sections ---------- */
const SECTIONS = [
  {id:'buy',   label:'Buy',   icon:'bag',  hue:38,  acc:'#FFB03A', wheel:false, title:'Things to<br><span>buy</span>',        eyebrow:'Shopping list', sub:'Stuff you keep meaning to order, split by country and store.', spin:''},
  {id:'eat',   label:'Eat',   icon:'fork', hue:345, acc:'#FF5C7A', title:'Places to<br><span>eat</span>',        eyebrow:'Restaurants',   sub:'Where to go, what to order, and the dishes worth repeating.', spin:'Pick a place'},
  {id:'cook',  label:'Cook',  icon:'pot',  hue:172, acc:'#4ECDC4', title:'Things to<br><span>cook</span>',       eyebrow:'Recipe book',   sub:'Your own recipes, written the way you actually cook them.', spin:'Pick a recipe'},
  {id:'watch', label:'Watch', icon:'play', hue:262, acc:'#A78BFA', title:'Things to<br><span>watch</span>',      eyebrow:'Watchlist',     sub:'Everything saved across streaming, in one list.', spin:'Pick something to watch'},
  {id:'log',   label:'Log',   icon:'history', hue:212, acc:'#5B9EF3', wheel:false, title:'What you<br><span>picked</span>',       eyebrow:'History',       sub:'Every pick the wheel made, plus anything you marked done.', spin:''}
];
const SEC = Object.fromEntries(SECTIONS.map(s=>[s.id,s]));
const VERB = {buy:'Bought', eat:'Ate', cook:'Cooked', watch:'Watched'};
const DID  = {buy:'Bought it', eat:'Ate this', cook:'Cooked this', watch:'Watched it'};

/* ---------- starter data ---------- */
const seed = ()=>({
  v:1,
  buy:{countries:[
    {id:uid(),name:'United States',code:'US',stores:[
      {id:uid(),name:'Amazon',url:'https://amazon.com',items:[]},
      {id:uid(),name:'Target',url:'https://target.com',items:[]},
      {id:uid(),name:'Walmart',url:'https://walmart.com',items:[]}
    ]},
    {id:uid(),name:'India',code:'IN',stores:[
      {id:uid(),name:'Amazon.in',url:'https://amazon.in',items:[]},
      {id:uid(),name:'Flipkart',url:'https://flipkart.com',items:[]},
      {id:uid(),name:'Blinkit',url:'https://blinkit.com',items:[]}
    ]}
  ]},
  eat:{countries:[
    {id:uid(),name:'United States',code:'US',places:[]},
    {id:uid(),name:'India',code:'IN',places:[]}
  ]},
  cook:{recipes:[]},
  log:[],
  watch:{platforms:[
    {id:uid(),name:'Netflix',titles:[]},
    {id:uid(),name:'Prime Video',titles:[]},
    {id:uid(),name:'YouTube',titles:[]},
    {id:uid(),name:'JioHotstar',titles:[]}
  ]}
});

/* ---------- storage ---------- */
const KEY = 'pickone.v1';
let DB = seed();
const usFirst = list => Array.isArray(list) && list.sort((a,b)=>(b.code==='US')-(a.code==='US'));
function normalizeDB(){ try{ usFirst(DB.buy.countries); usFirst(DB.eat.countries); }catch(e){} }
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ DB = Object.assign(seed(), JSON.parse(raw)); } }
  catch(e){ console.warn('Storage unavailable — running in memory only.'); }
  normalizeDB();
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
let saveTimer;
function save(){
  DB.updated = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ persist(); schedulePush(); }, 120);
}
load();
function logPush(sec,name,where,source,replaceId){
  DB.log ||= [];
  if(replaceId){
    const e = DB.log.find(x=>x.id===replaceId);
    if(e){ Object.assign(e,{name,where,source,ts:Date.now()}); DB.log = [e,...DB.log.filter(x=>x!==e)]; save(); return e; }
  }
  const e = {id:uid(), ts:Date.now(), sec, name, where:where||'', source};
  DB.log.unshift(e);
  if(DB.log.length>600) DB.log.length=600;
  save(); return e;
}
function logManual(sec,name,where){ logPush(sec,name,where,'manual'); toast((VERB[sec]||'Logged')+' · '+name); }
const countAll = db => {
  try{
    return db.buy.countries.reduce((a,c)=>a+c.stores.reduce((b,x)=>b+x.items.length,0),0)
         + db.eat.countries.reduce((a,c)=>a+c.places.reduce((b,p)=>b+1+(p.dishes||[]).length,0),0)
         + db.cook.recipes.length
         + db.watch.platforms.reduce((a,p)=>a+(p.titles||[]).length,0);
  }catch(e){ return 0; }
};

/* ---------- ui state ---------- */
const state = {
  sec: (location.hash||'#buy').slice(1),
  q: '',
  open: JSON.parse(sessionStorage.getItem('pickone.open')||'{}'),
  filter: {}
};
if(!SEC[state.sec]) state.sec='buy';
const toggleOpen = id => { state.open[id] = !state.open[id]; try{sessionStorage.setItem('pickone.open',JSON.stringify(state.open))}catch(e){} };
const isOpen = (id,def=true) => state.open[id]===undefined ? def : state.open[id];

/* ---------- toast + undo ---------- */
let toastEl, toastTimer;
function toast(msg, undo){
  toastEl?.remove(); clearTimeout(toastTimer);
  toastEl = document.createElement('div');
  toastEl.className='toast'; toastEl.setAttribute('role','status');
  toastEl.innerHTML = `<span>${esc(msg)}</span>` + (undo?`<button type="button">Undo</button>`:'');
  if(undo) toastEl.querySelector('button').onclick = ()=>{ undo(); save(); render(); toastEl.remove(); };
  document.body.appendChild(toastEl);
  toastTimer = setTimeout(()=>toastEl?.remove(), 6000);
}
/* =========================================================================
   RENDER
   ========================================================================= */
function renderNav(){
  const rail = $('#rail'), tabs = $('#tabs');
  $$('.rail-btn',rail).forEach(n=>n.remove());
  const foot = $('.rail-foot',rail);
  const railBtns = SECTIONS.map(s=>`
    <button class="rail-btn" data-go="${s.id}" style="--sec:${s.acc}" aria-current="${s.id===state.sec}">
      ${ic(s.icon)}<b>${s.label}</b>
    </button>`).join('');
  rail.insertAdjacentHTML('beforeend', railBtns);
  if(!foot){
    rail.insertAdjacentHTML('beforeend', `<div class="rail-foot">
      <button class="icon-btn" data-act="settings" title="Sync, backup and settings">${ic('cog')}<span class="sdot"></span></button>
    </div>`);
  } else rail.appendChild(foot);

  tabs.innerHTML = SECTIONS.map(s=>`
    <button class="tab" data-go="${s.id}" style="--sec:${s.acc}" aria-current="${s.id===state.sec}">
      ${ic(s.icon)}<b>${s.label}</b>
    </button>`).join('') + `
    <button class="tab" data-act="settings" style="--sec:var(--tx-2)" aria-current="false">
      ${ic('cog')}<span class="sdot"></span><b>More</b>
    </button>`;
}

function renderHeader(){
  const s = SEC[state.sec];
  $('#spinBtn').style.display = s.wheel===false ? 'none' : '';
  document.documentElement.style.setProperty('--acc', s.acc);
  document.documentElement.style.setProperty('--acc-h', s.hue);
  $('#eyebrow').textContent = s.eyebrow;
  $('#title').innerHTML = s.title;
  $('#sub').textContent = s.sub;
  $('#spinLabel').textContent = s.spin;
  document.title = 'Pick One — ' + s.label;
}

/* ---------- shared bits ---------- */
const toolbar = (placeholder, segs) => `
  <div class="toolbar">
    <label class="search">${ic('search')}
      <input type="search" id="q" placeholder="${placeholder}" value="${esc(state.q)}" autocomplete="off">
      <span class="sr">Search</span>
    </label>
    ${segs||''}
  </div>`;

const countryHead = (c) => `
  <div class="country"><span class="flagcode">${esc(c.code||c.name.slice(0,2).toUpperCase())}</span>
    <h2>${esc(c.name)}</h2><span class="rule"></span>
    <button class="mini country-del" data-act="del-country" title="Remove ${esc(c.name)}">${ic('trash')}</button></div>`;

function group({id, title, badge, meta, body, open}){
  return `<details class="group" data-g="${id}" ${open?'open':''}>
    <summary class="group-head">${ic('chev','chev')}
      <span class="g-title">${esc(title)}</span>
      ${meta?`<span class="pill ghost">${esc(meta)}</span>`:''}
      ${badge!==undefined?`<span class="pill">${badge}</span>`:''}
    </summary>
    <div class="group-body">${body}</div>
  </details>`;
}

function row({id, name, note, url, done, acts='edit,del', check=true}){
  const a = acts.split(',');
  return `<div class="row" data-k="${id}" data-done="${done?1:0}">
    ${check?`<button class="check" data-act="toggle" aria-pressed="${!!done}" aria-label="Mark ${esc(name)} done">${ic('check')}</button>`
          :`<span class="dot"></span>`}
    <span class="r-main">
      <span class="r-name">${esc(name)}</span>
      ${note?`<span class="r-note">${esc(note)}</span>`:''}
    </span>

function fmtDay(ts){
  const d=new Date(ts), now=new Date();
  const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((t0-day)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Yesterday';
  if(diff<7) return d.toLocaleDateString(undefined,{weekday:'long'});
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:d.getFullYear()!==now.getFullYear()?'numeric':undefined});
}
const fmtTime = ts => new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});

function renderLog(){
  const log = (DB.log||[]).filter(e=>hit(e.name+' '+(e.where||'')+' '+(SEC[e.sec]?.label||'')));
  const segs = `<div class="seg">
      <button data-lf="" aria-pressed="${!state.filter.lf}">All</button>
      ${SECTIONS.filter(x=>VERB[x.id]).map(x=>`<button data-lf="${x.id}" aria-pressed="${state.filter.lf===x.id}" style="--sec:${x.acc}">${x.label}</button>`).join('')}
    </div>`;
  const shown = state.filter.lf ? log.filter(e=>e.sec===state.filter.lf) : log;
  let html = toolbar('Search your history…', segs);
  if(!shown.length){
    return html + empty(state.q||state.filter.lf ? 'Nothing here' : 'No history yet',
      state.q||state.filter.lf ? 'Try a different search or filter.'
      : 'Spin a wheel, or tap the ✓ on anything you\'ve done. It shows up here.', '');
  }
  // group by day
  const groups=[]; let cur=null;
  shown.forEach(e=>{ const key=fmtDay(e.ts); if(!cur||cur.key!==key){cur={key,items:[]};groups.push(cur);} cur.items.push(e); });
  html += `<div class="logwrap">` + groups.map(g=>`
    <div class="logday"><span>${esc(g.key)}</span><span class="rule"></span></div>
    ${g.items.map(e=>{
      const sec=SEC[e.sec]||{acc:'var(--tx-2)',icon:'spark'};
      return `<div class="logrow" data-logid="${e.id}">
        <span class="logic" style="--sec:${sec.acc}">${ic(sec.icon)}</span>
        <span class="logmain">
          <span class="logname">${esc(e.name)}</span>
          <span class="logmeta">${esc(VERB[e.sec]||'Logged')}${e.where?' · '+esc(e.where):''}</span>
        </span>
        <span class="logtime">${e.source==='wheel'?`<span class="wtag" title="Chosen by the wheel">${ic('spark')}</span>`:''}${fmtTime(e.ts)}</span>
        <button class="mini" data-act="del-log" title="Remove">${ic('trash')}</button>
      </div>`;
    }).join('')}`).join('');
  html += `</div><div style="margin:20px 0 0"><button class="btn ghost danger" data-act="clear-log">${ic('trash')} Clear history</button></div>`;
  return html;
}

   ========================================================================= */
function ctx(el){
  const c = el.closest('[data-c]')?.dataset.c;
  const g = el.closest('[data-g]')?.dataset.g;
  const k = el.closest('[data-k]')?.dataset.k;
  return {c,g,k};
}
const findCountry = (list,id)=>list.find(x=>x.id===id);
function locate(el){
  const {c,g,k} = ctx(el);
  if(state.sec==='buy'){
    const co = findCountry(DB.buy.countries,c);
    const st = co?.stores.find(s=>s.id===g);
    return {co, st, item: st?.items.find(i=>i.id===k), list: st?.items};
  }
  if(state.sec==='eat'){
    const co = findCountry(DB.eat.countries,c);
    const pl = co?.places.find(p=>p.id===g);
    return {co, pl, item: pl?.dishes?.find(d=>d.id===k), list: pl?.dishes};
  }
  if(state.sec==='watch'){
    const pf = DB.watch.platforms.find(p=>p.id===g);
    return {pf, item: pf?.titles?.find(t=>t.id===k), list: pf?.titles};
  }
  return {recipe: DB.cook.recipes.find(r=>r.id===k), list: DB.cook.recipes};
}
function removeFrom(list,item,label){
  const i = list.indexOf(item); if(i<0) return;
  list.splice(i,1); save(); render();
  toast(`${label} deleted`, ()=>list.splice(i,0,item));
}

  }

  const p = DB.watch.platforms[srcIdx-1]; if(!p) return {label:'',items:[]};

function segColor(i,n){
  const h = +getComputedStyle(document.documentElement).getPropertyValue('--acc-h');
  const off=[-18,10,-6,20,0,-12][i%6], l=[57,68,49,74,62,53][i%6];
  return `hsl(${h+off} 78% ${l}%)`;
}
function wheelSVG(items){
  const n = items.length, R=96, C=100;
  if(!n) return `<svg class="wheel-svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="var(--surf-2)"/></svg>`;
  if(n===1) return `<svg class="wheel-svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="${segColor(0,1)}"/>
    <text x="100" y="44" text-anchor="middle">${esc(items[0].name.slice(0,11))}</text></svg>`;
  const seg = 360/n;
  const arc = items.map((it,i)=>{
    const a0=(i*seg-90)*Math.PI/180, a1=((i+1)*seg-90)*Math.PI/180;
    const x0=C+R*Math.cos(a0), y0=C+R*Math.sin(a0), x1=C+R*Math.cos(a1), y1=C+R*Math.sin(a1);
    const big = seg>180?1:0;
    const mid = (i+0.5)*seg;
    const label = n<=13 ? `<text transform="rotate(${mid} 100 100)" x="100" y="43" text-anchor="middle">${esc(it.name.length>11?it.name.slice(0,10)+'…':it.name)}</text>` : '';
    return `<path d="M${C} ${C} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${segColor(i,n)}" stroke="var(--surf)" stroke-width="1"/>${label}`;
  }).join('');
  return `<svg class="wheel-svg" viewBox="0 0 200 200">${arc}</svg>`;
}
function candidates(){ return W.items.filter(i=>!W.out.has(i.id)); }

function renderWheel(){
  const sheet = $('#wheelSheet'), s = SEC[state.sec];
  const srcs = wheelSources();
  const pool = poolFor(W.src);
  W.items = pool.items;
  const cand = candidates();
  sheet.innerHTML = `
    <button class="mini x" data-close>${ic('x')}</button>
    <h2>${esc(s.spin)}</h2>
    <p class="hint">${cand.length} in the wheel${srcs.length?` · ${esc(pool.label)}`:''}</p>
    ${srcs.length>1?`<div class="seg" style="justify-content:center;display:inline-flex;margin-bottom:14px">
      ${srcs.map((x,i)=>`<button data-src="${i}" aria-pressed="${i===W.src}">${esc(x)}</button>`).join('')}</div>`:''}
    ${cand.length ? `
      <div class="wheel-stage">
        <div class="needle" id="needle"></div>
        ${wheelSVG(cand)}
        <div class="hub"><b>${cand.length}</b></div>
      </div>
      <button class="btn primary wide" id="doSpin" style="margin-top:10px">Spin</button>
      <div id="wheelResult"></div>
      ${W.items.length>1?`
        <div class="chips-head">In the wheel <button type="button" data-all>All</button><button type="button" data-none>None</button></div>
        <div class="chips">${W.items.map(i=>`<button class="chip" data-chip="${i.id}" aria-pressed="${!W.out.has(i.id)}">${esc(i.name)}</button>`).join('')}</div>`:''}
    ` : `<div class="empty" style="margin-top:8px"><h3>Nothing to spin</h3>
        <p>Add a few things to this section first, then come back.</p></div>`}`;

  sheet.querySelector('[data-close]').onclick = ()=>$('#wheelDlg').close();
  sheet.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{ W.src=+b.dataset.src; W.out.clear(); W.angle=0; W.logId=null; renderWheel(); });
  sheet.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.chip; W.out.has(id)?W.out.delete(id):W.out.add(id);
    if(!candidates().length) W.out.delete(id);
    W.angle=0; renderWheel();
  });
  sheet.querySelector('[data-all]')?.addEventListener('click',()=>{ W.out.clear(); renderWheel(); });
  sheet.querySelector('[data-none]')?.addEventListener('click',()=>{
    W.out = new Set(W.items.slice(1).map(i=>i.id)); W.angle=0; renderWheel(); });
  sheet.querySelector('#doSpin')?.addEventListener('click', spin);
}

function spin(){
  if(W.busy) return;
  const cand = candidates(); if(!cand.length) return;
  const svg = $('#wheelSheet .wheel-svg'), needle = $('#needle'), btn = $('#doSpin');
  const n = cand.length, seg = 360/n;
  const win = Math.floor(Math.random()*n);
  const jitter = (Math.random()-0.5)*seg*0.7;
  const turns = 5 + Math.floor(Math.random()*3);
  const target = W.angle + turns*360 + ((360 - ((W.angle + (win+0.5)*seg) % 360)) % 360) + jitter;

  W.busy = true; btn.disabled = true; btn.textContent = 'Spinning…';
  $('#wheelResult').innerHTML = '';
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  svg.style.transition = 'none'; svg.style.transform = `rotate(${W.angle}deg)`;
  requestAnimationFrame(()=>{
    svg.style.transition = reduce ? 'transform .3s linear' : 'transform 4.4s cubic-bezier(.13,.83,.16,1)';
    svg.style.transform = `rotate(${target}deg)`;
  });

  let last = -1;
  const tickLoop = ()=>{
    if(!W.busy) return;
    let a=0;
    try{ const m = new DOMMatrixReadOnly(getComputedStyle(svg).transform); a=((Math.atan2(m.b,m.a)*180/Math.PI)%360+360)%360; }
    catch(err){ return; }
    const idx = Math.floor(a/seg);
    if(idx!==last){ last=idx; needle.classList.remove('tick'); void needle.offsetWidth; needle.classList.add('tick'); }
    requestAnimationFrame(tickLoop);
  };
  if(!reduce) requestAnimationFrame(tickLoop);

  setTimeout(()=>{
    W.busy = false; W.angle = target % 360;
    const it = cand[win];
    btn.disabled = false; btn.textContent = 'Spin again';
    const entry = logPush(state.sec, it.name, it.where, 'wheel', W.logId); W.logId = entry.id;
    const extra = [];
    if(it.url) extra.push(`<a class="btn primary" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener">${ic('link')} Open</a>`);
    if(it.recipe) extra.push(`<button class="btn primary" data-open-recipe>${ic('pot')} Open recipe</button>`);
    if(it.dishes && it.dishes.length) extra.push(`<button class="btn" data-dish>${ic('fork')} Pick a dish here</button>`);
    $('#wheelResult').innerHTML = `<div class="result">
        <div class="lbl">Tonight it's</div>
        <div class="val">${esc(it.name)}</div>
        ${it.where?`<div class="where">${esc(it.where)}</div>`:''}
        ${extra.length?`<div style="display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap">${extra.join('')}</div>`:''}
      </div>`;
    $('#wheelResult [data-open-recipe]')?.addEventListener('click',()=>{ $('#wheelDlg').close(); openRecipe(it.recipe); });
    $('#wheelResult [data-dish]')?.addEventListener('click',()=>{
      const d = it.dishes[Math.floor(Math.random()*it.dishes.length)];
      $('#wheelResult .val').textContent = d.name;
      const w = $('#wheelResult .where'); if(w) w.textContent = `at ${it.name}`;
      $('#wheelResult .lbl').textContent = 'Order this';
    });
  }, reduce?320:4450);
}
function openWheel(){ if(SEC[state.sec].wheel===false) return; W.out.clear(); W.angle=0; W.src=0; W.logId=null; renderWheel(); $('#wheelDlg').showModal(); }

/* =========================================================================
   SYNC — one secret GitHub Gist is the shared store for every device.
   Newest write wins. The local copy always works offline; the gist mirrors it.
   ========================================================================= */
const SYNC = {token:'', gist:'', status:'off', last:0, err:'', busy:0};
const FILE = 'pickone.json';
try{ Object.assign(SYNC, JSON.parse(localStorage.getItem('pickone.sync')||'{}')); }catch(e){}
if(SYNC.token && SYNC.gist) SYNC.status='ok';
const saveSyncCfg = ()=>{ try{ localStorage.setItem('pickone.sync', JSON.stringify({token:SYNC.token,gist:SYNC.gist})); }catch(e){} };

function setSync(st, err){
  SYNC.status = st;
  SYNC.err = err ? (err.status===401 ? 'That token was rejected — check it has the gist scope.'
                  : err.status===404 ? 'That gist is gone. Turn sync off, then connect again.'
                  : err.status ? 'GitHub said '+err.status+'.'
                  : 'Could not reach GitHub. Your changes are still saved on this device.') : '';
  document.body.dataset.sync = st;
  if($('#setDlg').open) paintSyncBlock();
}

async function gh(path, opts={}){
  const r = await fetch('https://api.github.com'+path, {...opts, headers:{
    'Authorization':'Bearer '+SYNC.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28',
    ...(opts.body?{'Content-Type':'application/json'}:{})
  }});
  if(!r.ok){ const e = new Error('GitHub '+r.status); e.status = r.status; throw e; }
  return r.json();
}
async function readGist(id){
  const g = await gh('/gists/'+id);
  const f = g.files && g.files[FILE];
  if(!f) return null;
  const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  return JSON.parse(text);
}

let pushTimer;
function schedulePush(){
  if(!SYNC.token || !SYNC.gist) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>syncPush(), 1600);
}
async function syncPush(){
  if(!SYNC.token || !SYNC.gist) return;
  SYNC.busy++; setSync('busy');
  try{
    await gh('/gists/'+SYNC.gist, {method:'PATCH', body: JSON.stringify({
      files:{[FILE]:{content: JSON.stringify(DB,null,2)}}
    })});
    SYNC.last = Date.now(); setSync('ok');
  }catch(e){ setSync('err', e); }
  finally{ SYNC.busy--; }
}
async function syncPull(quiet){
  if(!SYNC.token || !SYNC.gist || SYNC.busy) return;
  if($$('dialog').some(d=>d.open && d.id!=='setDlg')) return;
  SYNC.busy++; setSync('busy');
  let pushAfter = false;
  try{
    const remote = await readGist(SYNC.gist);
    if(remote && (remote.updated||0) > (DB.updated||0)){
      DB = Object.assign(seed(), remote); normalizeDB(); persist(); render();
      if(!quiet) toast('Updated from your other device');
    } else if(remote && (DB.updated||0) > (remote.updated||0)){
      pushAfter = true;
    }
    SYNC.last = Date.now(); setSync('ok');
  }catch(e){ setSync('err', e); }
  finally{ SYNC.busy--; }
  if(pushAfter) await syncPush();
}
async function syncConnect(token){
  SYNC.token = String(token||'').trim(); if(!SYNC.token) return;
  SYNC.busy++; setSync('busy');
  let handoff = null;
  try{
    const gists = await gh('/gists?per_page=100');
    const found = gists.find(g=>g.files && g.files[FILE]);
    if(found){
      SYNC.gist = found.id; saveSyncCfg();
      const remote = await readGist(found.id);
      const rc = countAll(remote||{}), lc = countAll(DB);
      if(rc && lc && JSON.stringify(remote)!==JSON.stringify(DB)) handoff = ()=>askMerge(remote, rc, lc);
      else if(remote && rc >= lc){ DB = Object.assign(seed(), remote); normalizeDB(); persist(); render(); }
      else handoff = 'push';
    } else {
      const made = await gh('/gists', {method:'POST', body: JSON.stringify({
        description:'Pick One — personal lists (synced across my devices)',
        public:false, files:{[FILE]:{content: JSON.stringify(DB,null,2)}}
      })});
      SYNC.gist = made.id; saveSyncCfg();
    }
    SYNC.last = Date.now(); setSync('ok');
  }catch(e){ setSync('err', e); openSettings(); SYNC.busy--; return; }
  SYNC.busy--;
  if(typeof handoff === 'function'){ handoff(); return; }
  if(handoff === 'push') await syncPush();
  openSettings(); toast('Sync is on');
}
function askMerge(remote, rc, lc){
  const dlg = $('#setDlg'), sheet = $('#setSheet');
  sheet.innerHTML = `
    <h2>Two copies found</h2>
    <p class="hint">This device and the synced copy both have things in them. Pick the one to keep —
      the other gets replaced everywhere.</p>
    <button class="btn wide" data-keep-local style="margin-bottom:9px">Keep this device (${lc} items)</button>
    <button class="btn wide" data-keep-remote>Use the synced copy (${rc} items)</button>
    <p class="hint" style="margin-top:16px">Not sure? Cancel, download a backup first, then come back.</p>
    <div class="sheet-foot"><button class="btn ghost" data-cancel>Cancel</button></div>`;
  sheet.querySelector('[data-keep-local]').onclick = async ()=>{ DB.updated = Date.now(); persist(); await syncPush(); openSettings(); toast('This device is now the master copy'); };
  sheet.querySelector('[data-keep-remote]').onclick = ()=>{ DB = Object.assign(seed(), remote); normalizeDB(); persist(); render(); setSync('ok'); openSettings(); toast('Synced copy loaded'); };
  sheet.querySelector('[data-cancel]').onclick = ()=>{ SYNC.token=''; SYNC.gist=''; setSync('off'); dlg.close(); };
  if(!dlg.open) dlg.showModal();
}
function syncDisconnect(){
  SYNC.token=''; SYNC.gist=''; SYNC.last=0;
  try{ localStorage.removeItem('pickone.sync'); }catch(e){}
  setSync('off'); openSettings(); toast('Sync turned off on this device');
}
const ago = t => { if(!t) return 'never';
  const m = Math.round((Date.now()-t)/60000);
  return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' hr ago'; };

function paintSyncBlock(){
  const box = $('#syncBlock'); if(!box) return;
  if(SYNC.token && SYNC.gist){
    box.innerHTML = `
      <div class="sync-row"><span class="sdot"></span>
        <span>${SYNC.status==='err' ? esc(SYNC.err) : SYNC.status==='busy' ? 'Syncing…' : 'Synced '+ago(SYNC.last)}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" data-sync-now>Sync now</button>
        <button class="btn ghost" data-sync-off>Turn off</button>

    box.querySelector('[data-sync-now]').onclick = ()=>syncPull();
    box.querySelector('[data-sync-off]').onclick = syncDisconnect;
  } else {
    box.innerHTML = `
      <p class="hint" style="margin:0 0 10px">Paste a GitHub token with the <b>gist</b> scope. The app finds or
        creates one secret gist and keeps every device on it.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="password" id="ghToken" placeholder="ghp_…" autocomplete="off"
          style="flex:1;min-width:170px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);outline:none">
        <button class="btn primary" data-sync-on>Connect</button>
      </div>
      <p class="hint" style="margin:10px 0 0">
        <a href="https://github.com/settings/tokens/new?scopes=gist&description=Pick%20One%20sync" target="_blank" rel="noopener">Create a token &rarr;</a>
        ${SYNC.status==='err'?`<br><span style="color:#FF6B6B">${esc(SYNC.err)}</span>`:''}</p>`;
    box.querySelector('[data-sync-on]').onclick = ()=>syncConnect($('#ghToken').value);
    box.querySelector('#ghToken').onkeydown = e=>{ if(e.key==='Enter') syncConnect(e.target.value); };
  }
}

function quickAdd(input, act){
  const v = input.value.trim(); if(!v) return;
  const L = locate(input);
  if(act==='add-item')  L.st?.items.push({id:uid(),name:v,url:'',note:'',done:false});
  if(act==='add-dish')  (L.pl.dishes ||= []).push({id:uid(),name:v,note:''});
  if(act==='add-title') (L.pf.titles ||= []).push({id:uid(),name:v,url:'',note:'',done:false});
  input.value=''; save();
  const keep = input.closest('[data-g]')?.dataset.g;
  render();
  const next = $(`[data-g="${keep}"] [data-qadd="${act}"]`);
  if(next){ next.closest('.qadd').dataset.collapsed='0'; next.focus(); }
}

document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]');
  if(go){ state.sec = go.dataset.go; state.q=''; state.filter={}; location.hash = go.dataset.go; render(); window.scrollTo({top:0}); return; }

  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  const L = () => locate(el);

  switch(act){
    case 'settings': openSettings(); break;

    case 'log': {
      const {item} = L(); if(!item) break;
      let where='';
      if(state.sec==='eat'){ const {pl}=L(); where=pl?pl.name:''; }
      else if(state.sec==='buy'){ const {st}=L(); where=st?st.name:''; }
      else if(state.sec==='watch'){ const {pf}=L(); where=pf?pf.name:''; }

      const {item} = L(); if(!item) break;

    case 'del-platform': { const {pf}=L(); removeFrom(DB.watch.platforms,pf,pf.name); break; }
    case 'del-country': {
      const list = state.sec==='buy' ? DB.buy.countries : DB.eat.countries;
      const c = findCountry(list, ctx(el).c); if(!c) break;
      const contents = state.sec==='buy'
        ? c.stores.reduce((a,s2)=>a+s2.items.length,0)
        : (c.places||[]).length;
      const doDel = ()=>{
        const i = list.indexOf(c); if(i<0) return;
        list.splice(i,1); save(); render();
        toast(`${c.name} removed`, ()=>list.splice(i,0,c));
      };
      if(contents>0){
        openForm({
          title:`Remove ${c.name}?`,
          hint: state.sec==='buy'
            ? `This deletes ${c.stores.length} store${c.stores.length!==1?'s':''} and ${contents} item${contents!==1?'s':''} inside it.`
            : `This deletes ${contents} place${contents!==1?'s':''} saved in it.`,
          fields:[{k:'confirm',label:`Type the country name to confirm`,ph:c.name}],
          submitLabel:'Remove country',
          onSave(v){ if(v.confirm.trim().toLowerCase()===c.name.toLowerCase()) doDel(); else toast('Name did not match — nothing removed'); }
        });
      } else doDel();
      break;
    }
    case 'add-country': {
      const list = state.sec==='buy' ? DB.buy.countries : DB.eat.countries;
      openForm({title:'New country', fields:[
        {k:'name',label:'Country',ph:'United Arab Emirates'},{k:'code',label:'Short code',ph:'AE'}
      ], submitLabel:'Add country', onSave(v){
        const base = {id:uid(),name:v.name,code:(v.code||v.name.slice(0,2)).toUpperCase()};
        list.push(state.sec==='buy' ? {...base,stores:[]} : {...base,places:[]});
      }});
      break;
    }
    case 'add-recipe': editRecipe(null); break;
    case 'open-recipe': { const {recipe}=L(); if(recipe) openRecipe(recipe); break; }
  }
});

document.addEventListener('keydown', e=>{
  const qa = e.target && e.target.closest ? e.target.closest('[data-qadd]') : null;
  if(qa && e.key==='Enter'){ e.preventDefault(); quickAdd(qa, qa.dataset.qadd); }
});

document.addEventListener('focusout', e=>{
  const box = e.target.closest && e.target.closest('.qadd');
  if(!box) return;
  // where is focus heading? if it's still inside this box (e.g. the Add button), keep it open
  const to = e.relatedTarget;
  if(to && box.contains(to)) return;
  setTimeout(()=>{
    if(box.contains(document.activeElement)) return;
    if(!box.querySelector('input').value.trim()) box.dataset.collapsed='1';
  }, 100);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ const box=e.target.closest && e.target.closest('.qadd');
    if(box){ box.querySelector('input').value=''; box.dataset.collapsed='1'; e.stopPropagation(); } }
}, true);
document.addEventListener('input', e=>{
  if(e.target.id!=='q') return;
  state.q = e.target.value;
  render();
  const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length);
});

$('#spinBtn').addEventListener('click', openWheel);

document.addEventListener('keydown', e=>{
  if(!e.target || !e.target.matches || e.target.matches('input,textarea,select')) return;
  if($$('dialog').some(d=>d.open)) return;
  const i = parseInt(e.key,10)-1;
  if(i>=0 && i<SECTIONS.length){ state.sec = SECTIONS[i].id; location.hash=state.sec; state.q=''; render(); }
  else if(e.key==='/'){ e.preventDefault(); $('#q')?.focus(); }
  else if(e.key.toLowerCase()==='s'){ openWheel(); }
});
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(SEC[h]&&h!==state.sec){ state.sec=h; render(); } });
$$('dialog').forEach(d=>d.addEventListener('click', e=>{ if(e.target===d) d.close(); }));

/* ---------- boot ---------- */
try{ localStorage.removeItem('pickone.theme'); }catch(e){}
document.body.dataset.sync = SYNC.status;
render();
if(SYNC.token && SYNC.gist) syncPull(true);

/* ---------- install as an app (PWA) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    // relative URL so it works whether served from / or /repo/ on GitHub Pages
    const base = location.pathname.replace(/[^/]*$/, '');
    navigator.serviceWorker.register(base + 'sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
